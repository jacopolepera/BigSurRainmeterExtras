[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=1000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#*2+20+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]
ContextTitle5=#AddItems#
ContextAction5=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle6=----
ContextAction6=[]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]

[Metadata]
Version=1.4.0
Information=Gmail List for BigSur (LUA Powered)
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

[Variables]
Type=Double
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc 

Name=Gmail
height=150
mPreviousCount=1

; Variabili segnaposto (verranno riempite da Lua)
Title1=""
Body1=""
Sender1=""
Title2=""
Body2=""
Sender2=""
; ... (Lua gestisce fino a 15, non serve dichiararle tutte qui, le crea lui)

Url=https://#GmailUser#:#GmailPass#@mail.google.com/mail/feed/atom
LinkInbox=https://mail.google.com/mail/u/0/#inbox

; ============================================================
; DOWNLOAD DATI E SCRIPT LUA
; ============================================================

[MeasureRaw]
Measure=WebParser
Url=#Url#
; Prendiamo TUTTO il contenuto del file XML in un colpo solo
RegExp=(?siU)^(.*)$
UpdateRate=300
; Importante: Decodifica i caratteri speciali prima di passarli a Lua
DecodeCharacterReference=1
CodePage=65001
FinishAction=[!UpdateMeasure MeasureScript]

[MeasureScript]
Measure=Script
ScriptFile=Parser.lua
; Quando il parser finisce di scaricare, Lua elabora e aggiorna la grafica
UpdateDivider=-1

; ============================================================
; STILI E PAGINAZIONE
; ============================================================

[styk]
X=((#Height#/7.5))*#scaledpi#
Y=(((#Height#/8))*#scaledpi#)R
H=((#Height#/5))*#scaledpi#
SolidColor=0,0,0,1
W=(295)*#scaledpi#
ClipString=1
StringStyle=NORMAL
FontColor=#textcolor2#
InlineSetting=#InlineShadow#
FontSize=(9)*#scaledpi#
FontFace=#ThemeFont#
AntiAlias=1
TooltipWidth=300
; Fondamentale per vedere le variabili aggiornate da Lua
DynamicVariables=1

[l2]
FontColor=#textcolor2#,225

[l3]
FontColor=#textcolor2#,200

[bgEe]
Meter=Image
ImageName=rounded.png
MeterStyle=Full
ImageAlpha=50
; Scroll GIÙ (verso di te) -> AUMENTA pagina (max 5)
MouseScrollDownAction=[!SetVariable mPreviousCount "(Clamp(#mPreviousCount# + 1, 1, 5))"][!Update]
; Scroll SU (in avanti) -> DIMINUISCE pagina (min 1)
MouseScrollUpAction=[!SetVariable mPreviousCount "(Clamp(#mPreviousCount# - 1, 1, 5))"][!Update]
DynamicVariables=1
solidcolor=0,0,0,1

[calc]
measure=calc
formula=#mPreviousCount#
dynamicvariables=1
IfCondition=#mPreviousCount# <= 1
IfTrueAction=[!HideMeterGroup Bye][!ShowMeterGroup 1][!SetVariable mPreviousCount "1"][!Update]
IfCondition2=#mPreviousCount# = 2
IfTrueAction2=[!HideMeterGroup Bye][!ShowMeterGroup 2][!Update]
IfCondition3=#mPreviousCount# = 3
IfTrueAction3=[!HideMeterGroup Bye][!ShowMeterGroup 3][!Update]
IfCondition4=#mPreviousCount# = 4
IfTrueAction4=[!HideMeterGroup Bye][!ShowMeterGroup 4][!Update]
IfCondition5=#mPreviousCount# >= 5
IfTrueAction5=[!HideMeterGroup Bye][!ShowMeterGroup 5][!SetVariable mPreviousCount "5"][!Update]


; ============================================================
; METERS (Visualizzazione)
; Usiamo #Variabili# invece di MeasureName
; ============================================================

; --- GRUPPO 1 ---
[Item1]
Meter=String
MeterStyle=styk
Text="#Sender1#: #Title1# - #Body1#"
ToolTipText="Da: #Sender1##CRLF#Oggetto: #Title1##CRLF##CRLF##Body1#"
Y=((#Height#/7.5))*#scaledpi#
LeftMouseUpAction=["#LinkInbox#"]
Group=1 | Bye | BigSur

